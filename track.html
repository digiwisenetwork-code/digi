<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiWise - Redirecting to Offer...</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #1d4ed8 100%);
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow: hidden;
        }

        .redirect-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.75rem;
            padding: 3.5rem 2.5rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.35rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .status-desc {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 0.5rem 1rem;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 9999px;
            font-size: 0.8rem;
            color: #059669;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="redirect-card">
        <a href="index.html" class="brand-logo">
            <div class="brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="brand-name">DigiWise</span>
        </a>

        <div class="loader-ring" id="loaderRing">
            <i class="fa-solid fa-arrow-right-to-bracket" style="color: #2563eb; font-size: 1.25rem;"></i>
        </div>

        <h2 class="status-title" id="statusTitle">Connecting Securely...</h2>
        <p class="status-desc" id="msg">Redirecting to verified destination offer. Please wait a moment.</p>

        <div class="secure-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>DigiWise SmartLink Protection</span>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        async function trackAndRedirect() {
            const params = new URLSearchParams(window.location.search);
            const refId = params.get('ref');

            if (!refId) {
                document.getElementById('statusTitle').innerText = 'Invalid Link';
                document.getElementById('msg').innerText = 'The tracking link is missing or invalid. Returning home...';
                document.getElementById('loaderRing').style.display = 'none';
                setTimeout(() => window.location.href = 'index.html', 2500);
                return;
            }

            try {
                const { data: assignment, error } = await sb
                    .from('assignments')
                    .select('*, campaigns(*)')
                    .eq('id', refId)
                    .single();

                if (error || !assignment) throw new Error('Offer not found');

                await sb.from('assignments')
                    .update({ count: (assignment.count || 0) + 1 })
                    .eq('id', refId);

                if (assignment.campaigns && assignment.campaigns.link) {
                    let dest = assignment.campaigns.link;
                    if (!dest.startsWith('http')) dest = 'https://' + dest;
                    
                    document.getElementById('statusTitle').innerText = 'Offer Verified!';
                    document.getElementById('msg').innerText = 'Redirecting you now...';
                    
                    setTimeout(() => {
                        window.location.href = dest;
                    }, 800);
                } else {
                    throw new Error('Destination link missing');
                }

            } catch (err) {
                console.error(err);
                document.getElementById('statusTitle').innerText = 'Redirecting...';
                document.getElementById('msg').innerText = 'Taking you to home page...';
                setTimeout(() => window.location.href = 'index.html', 2000);
            }
        }

        trackAndRedirect();
    </script>
</body>

</html>
